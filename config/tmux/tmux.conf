# tmux config for each computer. ~/.config/tmux/tmux.conf links to this file. It needs tmux 3.1 or later.

# Color
set -g default-terminal "tmux-256color"
# Reset the list first, so that a reload with prefix r does not add the entries again.
set -su terminal-overrides
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-overrides ",*256col*:Tc"

# Underlines
# Neovim uses curly underlines for diagnostics.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse
set -g mouse on

# Numbers
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Scrollback
set -g history-limit 10000

# Escape
# Send Escape at once, so that Neovim does not wait.
set -sg escape-time 0

# Splits
# The new pane starts in the folder of the current pane.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -r lets you push the key again without the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf loaded"

# Copy mode
set -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# Status bar
# The colors are Catppuccin Mocha.
set -g status-position top
set -g status-justify left
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-length 20
set -g status-right-length 50
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]'
set -g status-right '#[fg=#f38ba8]#(whoami)#[default] #[fg=#a6e3a1]%H:%M#[default]'

## Window list
set -g window-status-current-style 'fg=#1e1e2e,bg=#cba6f7,bold'
set -g window-status-current-format ' #I:#W#F '
set -g window-status-style 'fg=#cdd6f4,bg=#313244'
set -g window-status-format ' #I:#W#F '

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# Messages
set -g message-style 'fg=#cdd6f4,bg=#313244'

# Local overrides
# -q gives no error when the file does not exist.
source-file -q ~/.config/tmux/local.conf
