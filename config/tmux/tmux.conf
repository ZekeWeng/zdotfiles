# tmux config for each computer. ~/.config/tmux/tmux.conf links to this file. It needs tmux 3.1 or later.

# Color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-overrides ",*256col*:Tc"

# Underlines
# Neovim uses curly underlines for diagnostics.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Prefix
# Use Ctrl+A as the prefix key, not Ctrl+B.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse
set -g mouse on

# Numbers
# Start the window and pane numbers at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Give the windows new numbers when you close a window.
set -g renumber-windows on

# Scrollback
# Keep 10000 lines in each pane.
set -g history-limit 10000

# Escape
# Send Escape at once, so that Neovim does not wait.
set -sg escape-time 0

# Splits
# The new pane starts in the folder of the current pane.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Panes
# Go to a pane with h, j, k, and l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Change the pane size with H, J, K, and L. You can push the key again without the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows
# Go to the previous or the next window.
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Reload
# Load this file again.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf loaded"

# Copy mode
# Use the vi keys.
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
# y copies to the macOS clipboard.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# Status bar
# The colors are Catppuccin Mocha.
set -g status-position top
set -g status-justify left
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-length 20
set -g status-right-length 50
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]'
set -g status-right '#[fg=#f38ba8]#(whoami)#[default] #[fg=#a6e3a1]%H:%M#[default]'

## Window list
setw -g window-status-current-style 'fg=#1e1e2e,bg=#cba6f7,bold'
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-style 'fg=#cdd6f4,bg=#313244'
setw -g window-status-format ' #I:#W#F '

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# Messages
set -g message-style 'fg=#cdd6f4,bg=#313244'

# Local overrides
# -q gives no error when the file does not exist.
source-file -q ~/.config/tmux/local.conf
